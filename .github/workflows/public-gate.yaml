name: public-gate
on:
  pull_request:

permissions:
  contents: read

env:
  DPM_INSTALLER_VERSION: '3.6.0'
  DPM_LAUNCHER_VERSION: '1.0.22'
  DAML_SDK_VERSION: '3.6.0'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Leak check
        run: |
          set -euo pipefail
          ./.github/scripts/leak-check.sh .
      - name: No-AI-workflows audit
        run: |
          set -euo pipefail
          ./.github/scripts/no-ai-workflows-audit.sh .

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install dpm and Daml SDK
        run: |
          set -euo pipefail
          curl -sSL https://get.digitalasset.com/install/install.sh | sh -s -- "${DPM_INSTALLER_VERSION}"
          echo "${HOME}/.dpm/bin" >> "${GITHUB_PATH}"
          dpm="${HOME}/.dpm/bin/dpm"
          installed="$("${dpm}" --version | awk '/^version:/ {print $2; exit}')"
          if [[ "${installed}" != "${DPM_LAUNCHER_VERSION}" ]]; then
            echo "::error::dpm launcher '${installed:-<none>}' does not match the pinned ${DPM_LAUNCHER_VERSION}"
            exit 1
          fi
          "${dpm}" install "${DAML_SDK_VERSION}"
      - name: Restore
        run: |
          set -euo pipefail
          dotnet restore --source https://api.nuget.org/v3/index.json
      - name: Build
        run: |
          set -euo pipefail
          dotnet build --no-restore --configuration Release
      - name: Test
        run: |
          set -euo pipefail
          dotnet test --no-build --configuration Release
