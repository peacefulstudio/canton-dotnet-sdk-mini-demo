name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (no leading v, e.g. 0.6.0-preview.3). Every job runs from the existing tag v<version>.'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - name: Resolve the version
        id: r
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION_INPUT:-}" ]; then
            VERSION="${VERSION_INPUT}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "::error::no version input and not a tag"; exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a release version"; exit 1
          fi
          PROPS_VERSION="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1 || true)"
          if [ "${PROPS_VERSION}" != "${VERSION}" ]; then
            echo "::error::tag v${VERSION} does not match <Version> ${PROPS_VERSION} in Directory.Build.props at the tagged commit"; exit 1
          fi
          .github/scripts/changelog-section.sh "${VERSION}" > /dev/null
          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
          } >> "$GITHUB_OUTPUT"

  draft-bootstrap:
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/_release-lifecycle.yaml
    with:
      action: bootstrap
      tag: ${{ needs.resolve.outputs.tag }}

  publish-release:
    needs: [resolve, draft-bootstrap]
    permissions:
      contents: write
    uses: ./.github/workflows/_release-lifecycle.yaml
    with:
      action: finalize
      tag: ${{ needs.resolve.outputs.tag }}

  complete:
    needs: [resolve, draft-bootstrap, publish-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summarise release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "- draft-bootstrap: ${{ needs.draft-bootstrap.result }}"
            echo "- publish-release: ${{ needs.publish-release.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail unless every stage succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || { echo "::error::a release stage ended '${result}'"; exit 1; }
          done
