name: Auto-tag release

on:
  workflow_run:
    workflows: [CI, LocalNet]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the green main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Tag the green main commit and start the release
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; exit 0; }

          polling=false
          lookup_failed() {
            [ "${polling}" = "true" ] && return 0
            echo "::error::$1"
            exit 1
          }

          release_done_or_running() {
            local view_error runs
            if view_error="$(gh release view "${tag}" 2>&1 >/dev/null)"; then
              return 0
            fi
            case "${view_error}" in
              *"release not found"*) ;;
              *) lookup_failed "gh release view ${tag} failed: ${view_error}"; return 1 ;;
            esac
            for status in queued in_progress; do
              runs="$(gh run list --workflow release.yaml --branch "${tag}" --status "${status}" --json databaseId --jq 'length' 2>&1)" \
                || { lookup_failed "gh run list for ${tag} (${status}) failed: ${runs}"; return 1; }
              [ "${runs}" = "0" ] || return 0
            done
            return 1
          }

          main_tip="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          [ "${main_tip}" = "${HEAD_SHA}" ] || skip "${HEAD_SHA} is no longer the tip of main; a newer run decides"

          for workflow in ci.yaml localnet.yaml; do
            green="$(gh run list --workflow "${workflow}" --commit "${HEAD_SHA}" --event push --status success --json databaseId --jq 'length')"
            [ "${green}" != "0" ] || skip "${workflow} has no successful push run on ${HEAD_SHA} yet; its completion runs this workflow again"
          done

          version="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1 || true)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::'${version}' in Directory.Build.props is not a release version"; exit 1; }
          tag="v${version}"

          tag_exists=false
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            tag_exists=true
            ! release_done_or_running || skip "${tag} already exists and its release is published or running"
          fi

          held="$(gh pr list --state open --label hold-release --json number --jq 'length')"
          [ "${held}" = "0" ] || skip "${held} open pull request(s) carry hold-release"

          .github/scripts/changelog-section.sh "${version}" > /dev/null \
            || { echo "::error::CHANGELOG.md has no non-empty section for ${version}; refusing to tag"; exit 1; }

          if [ "${tag_exists}" = "true" ]; then
            echo "${tag} exists without a published or running release; dispatching it again"
          else
            gh api -X POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${HEAD_SHA}" >/dev/null
            echo "Tagged ${HEAD_SHA} as ${tag}"
          fi

          # Workaround: a tag pushed with GITHUB_TOKEN does not trigger `push` workflows (GitHub Actions
          # behaviour for events created by GITHUB_TOKEN), so the release is dispatched explicitly.
          gh workflow run release.yaml --ref "${tag}" -f "version=${version}"
          polling=true
          for _ in $(seq 1 30); do
            release_done_or_running && break
            sleep 2
          done
