name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DPM_INSTALLER_VERSION: '3.6.0'
  DPM_LAUNCHER_VERSION: '1.0.22'
  DAML_SDK_VERSION: '3.6.0'

jobs:
  package-name:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fail when daml.yaml carries a stale package name
        run: |
          set -euo pipefail
          committed="$(sed -n 's/^name: //p' daml/daml.yaml)"
          computed="$(bash scripts/compute-package-name.sh)"
          if [[ "${committed}" != "${computed}" ]]; then
            echo "::error::daml/daml.yaml name '${committed}' differs from scripts/compute-package-name.sh output '${computed}' - run 'make package-name' and commit"
            exit 1
          fi

  build:
    name: build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [Standalone, Dpm]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup JDK
        if: matrix.mode == 'Dpm'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          global-json-file: global.json

      - name: Install dpm and Daml SDK
        run: |
          set -euo pipefail
          curl -sSL https://get.digitalasset.com/install/install.sh | sh -s -- "${DPM_INSTALLER_VERSION}"
          echo "${HOME}/.dpm/bin" >> "${GITHUB_PATH}"
          dpm="${HOME}/.dpm/bin/dpm"
          installed="$("${dpm}" --version | awk '/^version:/ {print $2; exit}')"
          if [[ "${installed}" != "${DPM_LAUNCHER_VERSION}" ]]; then
            echo "::error::dpm launcher '${installed:-<none>}' does not match the pinned ${DPM_LAUNCHER_VERSION}"
            exit 1
          fi
          "${dpm}" install "${DAML_SDK_VERSION}"

      - name: Build and test with no JDK reachable
        if: matrix.mode == 'Standalone'
        run: |
          set -euo pipefail
          shadow_root="${RUNNER_TEMP}/path-without-java"
          kept=""
          IFS=: read -ra path_dirs <<< "${PATH}"
          for dir in "${path_dirs[@]}"; do
            [ -n "${dir}" ] || continue
            if [ ! -e "${dir}/java" ]; then
              kept="${kept:+${kept}:}${dir}"
              continue
            fi
            shadow="${shadow_root}/$(printf '%s' "${dir}" | tr '/' '_')"
            mkdir -p "${shadow}"
            for entry in "${dir}"/*; do
              name="${entry##*/}"
              [ "${name}" = "java" ] || ln -sf "${entry}" "${shadow}/${name}"
            done
            kept="${kept:+${kept}:}${shadow}"
          done
          export PATH="${kept}"
          for variable in $(env | sed -n -E 's/^((JAVA|JDK|JRE)[A-Za-z0-9_]*)=.*/\1/p'); do
            unset "${variable}"
          done
          if command -v java >/dev/null 2>&1; then
            echo "::error::java is still reachable at $(command -v java)"
            exit 1
          fi
          dotnet build MiniDemo.slnx --configuration Release
          dotnet test --configuration Release --no-build

      - name: Build with dpm codegen-cs
        if: matrix.mode == 'Dpm'
        run: dotnet build MiniDemo.slnx --configuration Release -p:DamlCodegenMode=Dpm

      - name: Upload generated bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.mode }}
          path: src/MiniDemo.Contracts/obj/Release/net10.0/DamlGenerated/**/*.cs
          if-no-files-found: error
          retention-days: 1

  same-bindings:
    name: both modes generate the same bindings
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both sets of bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bindings-*
          path: bindings

      - name: Diff Standalone against Dpm
        run: diff -r bindings/bindings-Standalone bindings/bindings-Dpm
