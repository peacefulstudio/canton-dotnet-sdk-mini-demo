name: LocalNet

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: localnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  demo:
    name: demo (localnet, require PQS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DPM_INSTALLER_VERSION: '3.5.2'
      DAML_SDK_VERSION: '3.5.2'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          global-json-file: global.json

      - name: Install dpm and Daml SDK
        run: |
          set -euo pipefail
          curl -sSL https://get.digitalasset.com/install/install.sh | sh -s -- "${DPM_INSTALLER_VERSION}"
          echo "${HOME}/.dpm/bin" >> "${GITHUB_PATH}"
          "${HOME}/.dpm/bin/dpm" install "${DAML_SDK_VERSION}"

      - name: Build the demo DAR
        working-directory: daml
        run: |
          set -euo pipefail
          dpm build
          ls -l .daml/dist/

      - name: Regenerate the C# bindings and fail on drift
        run: |
          set -euo pipefail
          dpm --version
          grep -m 1 'dpm-codegen-cs' codegen/daml.yaml
          bash scripts/codegen.sh
          cat "${DPM_HOME:-${HOME}/.dpm}/cache/components/ghcr.io/peacefulstudio/dpm-codegen-cs/.pinned-uri"
          if [ -n "$(git status --porcelain -- src/MiniDemo.Contracts/Generated/)" ]; then
            git status --short
            git diff --stat -- src/MiniDemo.Contracts/Generated/
            echo "::error::Committed C# bindings differ from a fresh dpm codegen-cs run; run scripts/codegen.sh and commit the result"
            exit 1
          fi

      - name: Build the demo
        run: make build

      - name: Boot a fresh LocalNet with PQS on a-validator-1 (canton-localnet v0.8.4-3)
        uses: peacefulstudio/canton-localnet@1cf682aae212d4e2fefb882bcf9c97ea95036a59 # v0.8.4-3
        with:
          validators: a
          pqs: 'true'
          timeout: 20m

      - name: Wait for PQS to subscribe before the demo uploads its DAR
        run: |
          set -euo pipefail
          for _ in $(seq 1 150); do
            if docker logs pqs-a-validator-1 2>&1 | grep -q "Contract filter inclusive"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::PQS on a-validator-1 did not subscribe within 300s" >&2
          exit 1

      - name: Run the demo with PQS required
        run: |
          set -uo pipefail
          REQUIRE_PQS=1 make run 2>&1 | tee "${RUNNER_TEMP}/demo.log"
          exit_code="${PIPESTATUS[0]}"
          {
            echo "### Demo exit code \`${exit_code}\`"
            echo ""
            grep PQS "${RUNNER_TEMP}/demo.log" | sed 's/^/    /' || true
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${exit_code}"

      - name: Dump LocalNet container logs
        if: failure()
        run: |
          set -uo pipefail
          docker ps -a
          for container in canton splice pqs-a-validator-1; do
            echo "::group::${container} (last 400 lines)"
            docker logs --timestamps --tail 400 "${container}" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Tear down LocalNet, volumes included
        if: always()
        uses: peacefulstudio/canton-localnet/teardown@1cf682aae212d4e2fefb882bcf9c97ea95036a59 # v0.8.4-3
