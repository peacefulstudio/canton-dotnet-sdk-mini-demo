name: LocalNet

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: localnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  demo:
    name: demo (localnet, require PQS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DPM_INSTALLER_VERSION: '3.6.0'
      DPM_LAUNCHER_VERSION: '1.0.22'
      DAML_SDK_VERSION: '3.6.0'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          global-json-file: global.json

      - name: Install dpm and Daml SDK
        run: |
          set -euo pipefail
          curl -sSL https://get.digitalasset.com/install/install.sh | sh -s -- "${DPM_INSTALLER_VERSION}"
          echo "${HOME}/.dpm/bin" >> "${GITHUB_PATH}"
          dpm="${HOME}/.dpm/bin/dpm"
          installed="$("${dpm}" --version | awk '/^version:/ {print $2; exit}')"
          if [[ "${installed}" != "${DPM_LAUNCHER_VERSION}" ]]; then
            echo "::error::dpm launcher '${installed:-<none>}' does not match the pinned ${DPM_LAUNCHER_VERSION}"
            exit 1
          fi
          "${dpm}" install "${DAML_SDK_VERSION}"

      - name: Build the demo, DAR and bindings included
        run: dotnet build src/MiniDemo/MiniDemo.csproj

      - name: Boot a fresh LocalNet with PQS on a-validator-1 (canton-localnet v0.9.4-1)
        uses: peacefulstudio/canton-localnet@7f5abf8f479b4a3c68db64b7f626ab3bc505cc6f # v0.9.4-1
        with:
          validators: a
          pqs: 'true'
          timeout: 20m

      - name: Wait for PQS to subscribe before the demo uploads its DAR
        run: |
          set -euo pipefail
          for _ in $(seq 1 150); do
            filter_line="$(docker logs pqs-a-validator-1 2>&1 | awk '/Contract filter/ && !seen { print; seen = 1 }' || true)"
            if [ -n "${filter_line}" ]; then
              echo "${filter_line}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::PQS on a-validator-1 did not subscribe within 300s" >&2
          exit 1

      - name: Run the demo with PQS required
        run: |
          set -uo pipefail
          set +e
          dotnet run --project src/MiniDemo -- --require-pqs 2>&1 | tee "${RUNNER_TEMP}/demo.log"
          exit_code="${PIPESTATUS[0]}"
          set -e
          case "${exit_code}" in
            0) meaning='demo completed on every transport and PQS projected everything' ;;
            1) meaning='LocalNet unreachable or a ledger operation failed' ;;
            65) meaning='cross-transport verification failed' ;;
            69) meaning='PQS fell short of full projection (--require-pqs)' ;;
            75) meaning='LocalNet unresponsive' ;;
            130) meaning='interrupted' ;;
            *) meaning='unexpected exit code' ;;
          esac
          {
            echo "### Demo exit code \`${exit_code}\`: ${meaning}"
            echo ""
            grep PQS "${RUNNER_TEMP}/demo.log" | sed 's/^/    /' || true
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${exit_code}"

      - name: Dump LocalNet container logs
        if: failure()
        run: |
          set -uo pipefail
          docker ps -a
          for container in canton splice pqs-a-validator-1; do
            echo "::group::${container} (last 400 lines)"
            docker logs --timestamps --tail 400 "${container}" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Search scribe logs for unknown Daml packages
        if: failure()
        run: |
          set -uo pipefail
          matches="$(docker logs pqs-a-validator-1 2>&1 | grep -i 'unknown Daml package' || true)"
          {
            echo "### Scribe \`unknown Daml package\` search"
            echo ""
            if [ -n "${matches}" ]; then
              echo "Found $(printf '%s\n' "${matches}" | wc -l) matching line(s); first five:"
              echo ""
              printf '%s\n' "${matches}" | head -5 | sed 's/^/    /'
            else
              echo "No matches."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          printf '%s\n' "${matches}"

      - name: Tear down LocalNet, volumes included
        if: always()
        uses: peacefulstudio/canton-localnet/teardown@7f5abf8f479b4a3c68db64b7f626ab3bc505cc6f # v0.9.4-1
